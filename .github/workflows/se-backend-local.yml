name: local CI/CD

on:
  push:
    branches:
      - dev
      
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_REPO }}/${{ secrets.BACKEND_NAME }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

  deploy:
    runs-on: [self-hosted, DeNeRATe-LOCAL]
    needs: build-and-push

    steps:
      - name: Check shell (PowerShell)
        run: Write-Output "Current shell is $env:ComSpec"
        shell: powershell

      - name: Check docker (cmd)
        run: docker --version
        shell: cmd

      - name: Login DockerHub
        run: echo %DOCKER_PASSWORD% | docker login -u %DOCKER_USERNAME% --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
            
      - name: Pull and run latest Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_REPO }}/${{ secrets.BACKEND_NAME }}:${{ github.sha }}
          docker pull $IMAGE
          docker stop ${{ secrets.BACKEND_NAME }} || true
          docker rm ${{ secrets.BACKEND_NAME }} || true
          docker run -d \
            --name ${{ secrets.BACKEND_NAME }} \
            -p 8080:8080 \
            -e ALIBABA_CLOUD_ACCESS_KEY=${{ secrets.ALIBABA_CLOUD_ACCESS_KEY }} \
            -e ALIBABA_CLOUD_SECRET_KEY=${{ secrets.ALIBABA_CLOUD_SECRET_KEY }} \
            $IMAGE
