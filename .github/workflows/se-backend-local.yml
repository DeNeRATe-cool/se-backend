name: local CI/CD

on:
  push:
    branches:
      - dev
      
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_REPO }}/${{ secrets.BACKEND_NAME }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

  deploy:
    runs-on: [self-hosted, DeNeRATe-LOCAL]
    needs: build-and-push

    steps:
      - name: Check shell (PowerShell)
        run: Write-Output "Current shell is $env:ComSpec"
        shell: powershell

      - name: Check docker (cmd)
        run: docker --version
        shell: cmd

      - name: Login DockerHub (cmd)
        shell: cmd
        run: echo %DOCKER_PASSWORD% | docker login -u %DOCKER_USERNAME% --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull and run latest Docker image (cmd)
        shell: cmd
        run: |
          set ALIBABA_CLOUD_ACCESS_KEY=%ALIBABA_CLOUD_ACCESS_KEY%
          set ALIBABA_CLOUD_SECRET_KEY=%ALIBABA_CLOUD_SECRET_KEY%
          set IMAGE=%DOCKER_REPO%/%BACKEND_NAME%:%GITHUB_SHA%
          echo AccessKey=%ALIBABA_CLOUD_ACCESS_KEY%
          echo SecretKey=%ALIBABA_CLOUD_SECRET_KEY%
          docker pull %IMAGE%
          docker stop %BACKEND_NAME% || exit 0
          docker rm %BACKEND_NAME% || exit 0
          docker run -d ^
            --name %BACKEND_NAME% ^
            -p 8080:8080 ^
            -e ALIBABA_CLOUD_ACCESS_KEY=%ALIBABA_CLOUD_ACCESS_KEY% ^
            -e ALIBABA_CLOUD_SECRET_KEY=%ALIBABA_CLOUD_SECRET_KEY% ^
            %IMAGE%
        env:
          BACKEND_NAME: ${{ secrets.BACKEND_NAME }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
          ALIBABA_CLOUD_ACCESS_KEY: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY }}
          ALIBABA_CLOUD_SECRET_KEY: ${{ secrets.ALIBABA_CLOUD_SECRET_KEY }}
          GITHUB_SHA: ${{ github.sha }}
