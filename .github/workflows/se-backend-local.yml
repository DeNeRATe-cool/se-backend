name: local CI/CD

on:
  push:
    branches:
      - dev
      
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_REPO }}/${{ secrets.BACKEND_NAME }}:${{ github.sha }}
          LATEST=${{ secrets.DOCKER_REPO }}/${{ secrets.BACKEND_NAME }}:latest
          docker build -t $IMAGE -t $LATEST .
          docker push $IMAGE
          docker push $LATEST

  pull-docker-image:
    runs-on: [self-hosted, DeNeRATe-LOCAL]
    needs: build-and-push

    steps:
      - name: Check shell
        run: Write-Output "Current shell is $env:ComSpec"
        shell: powershell

      - name: Check docker (cmd)
        run: docker --version
        shell: cmd

      - name: Login DockerHub
        shell: cmd
        run: echo %DOCKER_PASSWORD% | docker login -u %DOCKER_USERNAME% --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull latest Docker image
        shell: cmd
        run: |
          set IMAGE=%DOCKER_REPO%/%BACKEND_NAME%:latest
          docker pull %IMAGE%
        env:
          BACKEND_NAME: ${{ secrets.BACKEND_NAME }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}

  deploy:
    runs-on: [self-hosted, DeNeRATe-LOCAL]
    needs: pull-docker-image
    env:
      ALIBABA_CLOUD_ACCESS_KEY: ${{ secrets.ALIBABA_ACCESS_KEY }}
      ALIBABA_CLOUD_SECRET_KEY: ${{ secrets.ALIBABA_SECRET_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure kubectl and kubeconfig
        shell: cmd
        run: |
          kubectl version --client=true
          set "kubeConfig=%USERPROFILE%\.kube\config"
          if not exist "%kubeConfig%" (
            echo kubeconfig not found at "%kubeConfig%". Enable Kubernetes in Docker Desktop, or provide KUBECONFIG.
            exit /b 1
          )
          set "KUBECONFIG=%kubeConfig%"
          echo KUBECONFIG=%kubeConfig%>> %GITHUB_ENV%
          kubectl config current-context
          kubectl get nodes

      - name: Create namespace
        shell: cmd
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Create/Update app secrets for ali-keys
        shell: cmd
        run: |
          kubectl -n se create secret generic ali-keys ^
            --from-literal=ALIBABA_CLOUD_ACCESS_KEY="%ALIBABA_CLOUD_ACCESS_KEY%" ^
            --from-literal=ALIBABA_CLOUD_SECRET_KEY="%ALIBABA_CLOUD_SECRET_KEY%" ^
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply base manifests
        shell: cmd
        run: |
          kubectl -n se apply -f k8s/deployment.yaml
          kubectl -n se apply -f k8s/service.yaml

      - name: Rollout with current image
        shell: cmd
        run: |
          set image=denerate/se-backend:latest
          kubectl -n se set image deployment/se-backend se-backend=%image% --record
          kubectl -n se rollout status deployment/se-backend --timeout=180s
          kubectl -n se get pods -o wide
          kubectl -n se get svc se-backend
