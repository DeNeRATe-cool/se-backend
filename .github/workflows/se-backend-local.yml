name: local CI/CD

on:
  push:
    branches:
      - dev
      
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'

      - name: Run tests
        run: mvn -B -s settings.xml test

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_REPO }}/${{ secrets.BACKEND_NAME }}:${{ github.sha }}
          LATEST=${{ secrets.DOCKER_REPO }}/${{ secrets.BACKEND_NAME }}:latest
          docker build -t $IMAGE -t $LATEST .
          docker push $IMAGE
          docker push $LATEST

  pull-docker-image:
    runs-on: [self-hosted, DeNeRATe-LOCAL]
    needs: build-and-push
    env:
      BACKEND_NAME: ${{ secrets.BACKEND_NAME }}
      DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
      GITHUB_SHA: ${{ github.sha }}

    steps:
      - name: Check shell
        run: Write-Output "Current shell is $env:ComSpec"
        shell: powershell

      - name: Check docker (cmd)
        run: docker --version
        shell: cmd

      - name: Login DockerHub
        shell: cmd
        run: echo %DOCKER_PASSWORD% | docker login -u %DOCKER_USERNAME% --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker image by SHA
        shell: cmd
        run: |
          set IMAGE=%DOCKER_REPO%/%BACKEND_NAME%:%GITHUB_SHA%
          docker pull %IMAGE%

  deploy:
    runs-on: [self-hosted, DeNeRATe-LOCAL]
    needs: pull-docker-image
    env:
      ALIBABA_CLOUD_ACCESS_KEY: ${{ secrets.ALIBABA_ACCESS_KEY }}
      ALIBABA_CLOUD_SECRET_KEY: ${{ secrets.ALIBABA_SECRET_KEY }}
      BACKEND_NAME: ${{ secrets.BACKEND_NAME }}
      DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure kubectl and kubeconfig
        shell: cmd
        run: |
          kubectl version --client=true
          set "kubeConfig=%USERPROFILE%\.kube\config"
          if not exist "%kubeConfig%" (
            echo kubeconfig not found at "%kubeConfig%". Enable Kubernetes in Docker Desktop, or provide KUBECONFIG.
            exit /b 1
          )
          set "KUBECONFIG=%kubeConfig%"
          echo KUBECONFIG=%kubeConfig%>> %GITHUB_ENV%
          kubectl config current-context
          kubectl get nodes

      - name: Create namespace
        shell: cmd
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Create/Update app secrets for ali-keys
        shell: cmd
        run: |
          kubectl -n se create secret generic ali-keys ^
            --from-literal=ALIBABA_CLOUD_ACCESS_KEY="%ALIBABA_CLOUD_ACCESS_KEY%" ^
            --from-literal=ALIBABA_CLOUD_SECRET_KEY="%ALIBABA_CLOUD_SECRET_KEY%" ^
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply base manifests
        shell: cmd
        run: |
          kubectl -n se apply -f k8s/deployment.yaml
          kubectl -n se apply -f k8s/service.yaml

      - name: Rollout with SHA image
        shell: cmd
        run: |
          set image=%DOCKER_REPO%/%BACKEND_NAME%:%GITHUB_SHA%
          kubectl -n se set image deployment/se-backend se-backend=%image%
          kubectl -n se rollout status deployment/se-backend --timeout=180s
          kubectl -n se get pods -o wide
          kubectl -n se get svc se-backend

  integration-test:
    runs-on: [self-hosted, DeNeRATe-LOCAL]
    needs: deploy
    env:
      BASE_URL: http://localhost:30080
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Postman
        shell: cmd
        run: npm install -g newman newman-reporter-htmlextra

      - name: Wait for service to be reachable
        shell: cmd
        run: |
          set URL=%BASE_URL%/
          setlocal EnableDelayedExpansion
          for /l %%i in (1,1,30) do (
            for /f "usebackq delims=" %%H in (`curl -s -o NUL -w "%%{http_code}" "!URL!"`) do set "CODE=%%H"
            echo Attempt %%i: HTTP !CODE!
            if "!CODE!"=="" set "CODE=000"
            if !CODE! GEQ 200 if !CODE! LSS 500 goto ok
            timeout /T 5 /NOBREAK >NUL
          )
          echo Service not reachable at !URL!
          exit /b 1
          :ok
          endlocal
          echo Service is reachable at %URL%

      - name: Prepare test files
        shell: cmd
        run: |
          if not exist tests\files mkdir tests\files
          echo this is uploadFile content > tests\files\upload.txt
          echo this is replaceFile content > tests\files\replace.txt
      
      - name: Run API tests (Postman via Newman)
        shell: cmd
        run: |
          if not exist test-results mkdir test-results
          newman run postman\postman_collection.json ^
            -e postman\postman_environment.json ^
            --reporters cli,junit,htmlextra ^
            --reporter-junit-export test-results\junit.xml ^
            --reporter-htmlextra-export test-results\html-report.html ^
            --env-var baseUrl="%BASE_URL%" ^
            --env-var uploadFile=tests/files/upload.txt ^
            --env-var replaceFile=tests/files/replace.txt

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/